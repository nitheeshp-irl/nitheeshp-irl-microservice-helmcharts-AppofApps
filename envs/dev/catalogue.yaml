replicaCount: 1

image:
  repository: nitheesh86/microservice-catalogue
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 5000

resources:
  limits:
    memory: "512Mi"
  requests:
    cpu: "100m"
    memory: "256Mi"

livenessProbe:
  httpGet:
    path: /
    port: 5000
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /
    port: 5000
  initialDelaySeconds: 5
  periodSeconds: 5