apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend
  namespace: argocd
  annotations:
    kargo.akuity.io/authorized-stage: craftista:frontend-dev-stage
spec:
  project: craftista
  source:
    repoURL: https://github.com/nitheeshp-irl/nitheeshp-irl-microservice-helmcharts-AppofApps
    targetRevision: main
    path: service-charts/frontend
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: 'https://7C0E0364DBF73CBBFA88A30E1DF0703E.gr7.us-east-2.eks.amazonaws.com'
    namespace: 'frontend'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true