apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: craftista
  namespace: argocd
spec:
  description: Project for Craftista microservices
  sourceRepos:
    - '*'
  sourceNamespaces:
    - '*'
  destinations:
    - namespace: '*'
      server: '*'
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
