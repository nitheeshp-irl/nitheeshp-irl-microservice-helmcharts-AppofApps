apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: craftista-app-of-apps
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/nitheeshp-irl/nitheeshp-irl-microservice-helmcharts-AppofApps
    targetRevision: HEAD
    path: apps
  destination:
    server: 'arn:aws:eks:us-east-2:264988460735:cluster/argocd-poc'
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true